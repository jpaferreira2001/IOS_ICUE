name: Build iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project ICueLights.xcodeproj -scheme ICueLights \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/ICueLights.app out/Payload/
          cd out && zip -qr ICueLights.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ICueLights-ipa
          path: ios/out/ICueLights.ipa
