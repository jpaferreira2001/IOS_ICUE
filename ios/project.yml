name: ICueLights
options:
  bundleIdPrefix: com.icuelights
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ICueLights:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icuelights.app
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: iCUE Lights
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Talks to the iCUE bridge running on your PC.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: ICueLightsWidget

  ICueLightsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icuelights.app.widget
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: iCUE Lights
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Talks to the iCUE bridge running on your PC.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
