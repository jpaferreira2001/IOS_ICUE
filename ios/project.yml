name: ICueLights
options:
  bundleIdPrefix: com.jpaferreira
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ICueLights:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        # Unique to this developer so a sideloader has no reason to rewrite it. The widget's ID
        # must stay "<app ID>.<one component>" or iOS silently ignores the extension.
        PRODUCT_BUNDLE_IDENTIFIER: com.jpaferreira.icuelights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: iCUE Lights
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Talks to the iCUE bridge running on your PC.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: ICueLightsWidget

  ICueLightsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jpaferreira.icuelights.widget
    info:
      path: Config/Widget-Info.plist
      properties:
        # Must differ from the app's name: Sideloadly matches App IDs by name.
        CFBundleDisplayName: iCUE Lights Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Talks to the iCUE bridge running on your PC.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
